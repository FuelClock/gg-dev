<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-flag" aria-hidden="true">{% include flag.html %}</span>
      <span class="brand-name">De Goud Graaiers</span>
    </a>
    <nav class="site-nav" aria-label="Site">
      {% for item in site.nav %}
      <a href="{{ item.url | relative_url }}">{{ item.label }}</a>
      {% endfor %}
    </nav>
    <a class="btn btn-gold btn-sm" href="ts3server://{{ site.teamspeak }}">TeamSpeak</a>
  </div>
</header>
